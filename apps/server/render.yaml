services:
  - type: web
    name: trackflow-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard
      - key: REDIS_URL
        sync: false # Set this manually in Render dashboard (optional)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL, e.g. https://thravic.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      # Paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false # sk_live_... from your Paystack dashboard
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false # Same as your Paystack secret key (used for HMAC verification)
      # Frontend URL (for Paystack callback redirects)
      - key: FRONTEND_URL
        sync: false # e.g. https://thravic.vercel.app
      # Optional — Email alerts
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
