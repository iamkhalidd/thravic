# ──────────────────────────────────────────────
# CI — one job per project
# ──────────────────────────────────────────────
# There is no root package.json and no npm workspaces, so each job installs
# and builds only its own project, using that project's own lockfile.
#
# The tracker job builds part of the API project: apps/api/tracker compiles to
# apps/api/app/static/tracker.js, which is committed and served by the API.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check app tests

      - name: Test
        env:
          # Without this the Redis-backed tests skip instead of running
          REDIS_URL: redis://localhost:6379
        run: python -m pytest

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  admin:
    name: Admin (apps/admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  tracker:
    name: Tracker (apps/api/tracker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/tracker
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: apps/api/tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The served artifact is the committed file, so a build that changes it
      # means someone forgot to commit the rebuild.
      - name: Check committed artifact is up to date
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- apps/api/app/static/tracker.js

      # tracker.py byte-replaces the placeholder; two occurrences would leave
      # one un-substituted and ship a literal "${apiUrl}/api/collect" to browsers.
      - name: Check the apiUrl placeholder is unique
        run: test "$(grep -c -F '${apiUrl}' ../app/static/tracker.js)" = "1"
