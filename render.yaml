# Render Blueprint for the Thravic API.
#
# NOTE: this file must live at the REPOSITORY ROOT for Render to discover it as a
# Blueprint. The API code lives in apps/api (see `rootDir`), which is why the
# build/start commands below are relative to that directory.
services:
  - type: web
    name: trackflow-api-fastapi
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Migrations are not run on boot; apply them before serving.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Serve Swagger UI at /docs in production.
      - key: DOCS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      # Optional. Leave BLANK to run without Redis: caching degrades to a no-op
      # and the rate limiter is skipped (same graceful degradation as the old
      # backend). Paste a Redis URL when you want caching + rate limiting.
      - key: REDIS_URL
        sync: false
      # Must keep the values the service had before the cutover so tokens survive
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # REQUIRED. The served tracker and the domain embed snippet resolve
      # `SERVER_URL || API_URL || ''` (NOT RENDER_EXTERNAL_URL), so if both are
      # empty the tracking script ships with an empty endpoint and analytics break.
      # Set to this service's public URL, e.g. https://<service>.onrender.com or
      # your custom domain.
      - key: SERVER_URL
        sync: false
      # Used to build OAuth redirect_uri values (`API_URL || RENDER_EXTERNAL_URL`).
      # Set to the same public URL (needed for correct OAuth callbacks + Paystack
      # webhook URL) when using a custom domain.
      - key: API_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 500
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Outgoing-email "from" address (must be a verified Resend sender).
      - key: SMTP_FROM
        value: TrackFlow <onboarding@resend.dev>
      # OAuth (leave blank to disable a provider). Register redirect URIs as
      # {API_URL}/api/auth/google/callback and {API_URL}/api/auth/github/callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # AI insights (optional; the endpoints 403 when unset)
      - key: GEMINI_API_KEY
        sync: false
